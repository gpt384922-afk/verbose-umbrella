services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ychunter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ychunter"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ycbot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_DSN: postgresql+asyncpg://postgres:postgres@postgres:5432/ychunter
    depends_on:
      postgres:
        condition: service_healthy

  ycweb:
    build: .
    restart: unless-stopped
    command: python -m ycbot.web
    env_file: .env
    environment:
      DATABASE_DSN: postgresql+asyncpg://postgres:postgres@postgres:5432/ychunter
      WEB_HOST: 0.0.0.0
      WEB_PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
