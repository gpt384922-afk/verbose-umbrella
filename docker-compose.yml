services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ychunter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ychunter"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ycbot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_DSN: postgresql+asyncpg://postgres:postgres@postgres:5432/ychunter
      YC_CENTER_CHROME_BINARY: ${YC_CENTER_CHROME_BINARY:-/usr/bin/chromium}
      YC_CENTER_CHROME_USER_DATA_DIR: ${YC_CENTER_CHROME_USER_DATA_DIR:-/data/chrome-profile}
      YC_CENTER_SELENIUM_HEADLESS: ${YC_CENTER_SELENIUM_HEADLESS:-true}
      YC_CENTER_SELENIUM_QUIT: ${YC_CENTER_SELENIUM_QUIT:-true}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - chrome_profile:/data/chrome-profile

volumes:
  postgres_data:
  chrome_profile:
